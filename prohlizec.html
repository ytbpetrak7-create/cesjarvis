<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikona-192.png">
<title>J.A.R.V.I.S. Online — v prohlížeči</title>
<style>
  :root { --bg:#0a0e17; --card:#121a2b; --accent:#00d4ff; --text:#e8edf5; --muted:#8b98ad; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',Arial,sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { text-align:center; padding:20px; }
  header h1 { color:var(--accent); letter-spacing:4px; }
  header h1 .tag { font-size:.4em; vertical-align:middle; background:var(--accent); color:#04121a; padding:3px 10px; border-radius:6px; letter-spacing:1px; }
  header a { color:var(--muted); text-decoration:none; font-size:.9em; }
  #chat { flex:1; overflow-y:auto; max-width:800px; width:100%; margin:0 auto; padding:10px 20px; }
  .msg { margin:10px 0; padding:12px 16px; border-radius:10px; max-width:80%; }
  .me { background:#1e2c4a; margin-left:auto; }
  .jarvis { background:var(--card); border-left:4px solid var(--accent); }
  .jarvis b { color:var(--accent); }
  #bar { display:flex; gap:10px; max-width:800px; width:100%; margin:0 auto; padding:10px 20px 25px; }
  #in { flex:1; padding:14px; border-radius:8px; border:1px solid #223; background:#000; color:var(--text); font-size:1em; }
  button { padding:14px 20px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; font-size:1em; }
  #send { background:var(--accent); color:#04121a; }
  #mic { background:#1e2c4a; color:var(--text); }
  #mic.on { background:#c00; color:#fff; }
  #instal { display:none; margin-top:10px; background:var(--accent); color:#04121a; font-size:.9em; padding:8px 16px; border-radius:20px; }
  @media (max-width: 600px) {
    body { height:100dvh; }
    header { padding:14px 10px 6px; }
    header h1 { font-size:1.25em; letter-spacing:2px; }
    #chat { padding:6px 10px; }
    .msg { max-width:92%; padding:10px 12px; }
    #bar { padding:6px 10px 14px; gap:6px; }
    #in { font-size:16px; padding:12px; }
    button { padding:12px 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S. <span class="tag">ONLINE</span></h1>
  <a href="index.html">← zpět na hlavní stránku</a>
  <div><button id="instal">📲 Nainstalovat do telefonu</button></div>
</header>
<div id="chat"></div>
<div id="bar">
  <input id="in" placeholder="Napiš příkaz… (např. kolik je hodin)" autocomplete="off">
  <button id="mic" title="Hlasový vstup">🎙</button>
  <button id="send">Odeslat</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('in');
function add(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = (who === 'jarvis' ? '<b>Jarvis:</b> ' : '') + text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function speak(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'cs-CZ';
    speechSynthesis.speak(u);
  } catch (e) {}
}
const vtipy = [
  "Proč programátoři nemají rádi přírodu? Moc bugů.",
  "Kolik programátorů je potřeba na výměnu žárovky? Žádného, to je hardwarový problém.",
  "Proč Java vývojáři nosí brýle? Protože nevidí sharp.",
  "SQL dotaz vejde do baru a ptá se dvou tabulek: Můžu se přidat?"
];
function bezDiakritiky(t) {
  return (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function odpovez(q) {
  const s = bezDiakritiky(q);
  let r = "";
  if (/ahoj|cau|nazdar|zdravim|dobry den/.test(s)) r = "Zdravím! Systémy jsou online. Co potřebuješ?";
  else if (/kolik je|hodin|cas/.test(s)) r = "Je " + new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }) + ".";
  else if (/datum|den je|jaky je den|jaky den|kolika/.test(s)) r = "Dnes je " + new Date().toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ".";
  else if (/vtip|vtipko|zabav/.test(s)) r = vtipy[Math.floor(Math.random() * vtipy.length)];
  else if (/otevri youtube|pust youtube|youtube/.test(s)) { r = "Otevírám YouTube."; window.open('https://youtube.com', '_blank'); }
  else if (/otevri google|pust google|google/.test(s)) { r = "Otevírám Google."; window.open('https://google.com', '_blank'); }
  else if (/otevri seznam|seznam/.test(s)) { r = "Otevírám Seznam."; window.open('https://seznam.cz', '_blank'); }
  else if (/hledej|vyhledej|najdi|co je/.test(s)) {
    const dotaz = s.replace(/hledej|vyhledej|najdi|mi|prosim|co je|co to je/g, '').trim();
    if (dotaz) { r = "Vyhledávám: " + dotaz; window.open('https://www.google.com/search?q=' + encodeURIComponent(dotaz), '_blank'); }
    else r = "Co mám vyhledat?";
  }
  else if (/kdo jsi|co jsi/.test(s)) r = "Jsem Jarvis Online — běžím přímo v prohlížeči, bez instalace.";
  else if (/co umis|pomoc|help/.test(s)) r = "Umím: čas, datum, vtip, otevřít YouTube/Google/Seznam, vyhledávat. Vyšší edice umí víc!";
  else if (/diky|dekuji/.test(s)) r = "Není zač!";
  else if (/nudim se/.test(s)) r = "Můžu ti říct vtip, nebo něco vyhledat. Co chceš?";
  else r = ["Hmm, zajímavé.", "Rozumím. Zkus třeba: kolik je hodin?", "Tohle online neumím — podívej se na vyšší edice!"][Math.floor(Math.random() * 3)];
  add('jarvis', r);
  speak(r);
}
document.getElementById('send').onclick = () => {
  if (!input.value.trim()) return;
  add('me', input.value);
  odpovez(input.value);
  input.value = '';
};
input.onkeydown = e => { if (e.key === 'Enter') document.getElementById('send').click(); };
const mic = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = 'cs-CZ';
  mic.onclick = () => { rec.start(); mic.classList.add('on'); };
  rec.onresult = e => { const t = e.results[0][0].transcript; mic.classList.remove('on'); add('me', t); odpovez(t); };
  rec.onend = () => mic.classList.remove('on');
  rec.onerror = () => mic.classList.remove('on');
} else {
  mic.onclick = () => alert('Tvůj prohlížeč neumí hlasový vstup. Zkus Chrome.');
}
add('jarvis', 'ONLINE verze. Napiš příkaz nebo klikni na mikrofon a mluv česky.');

// --- Instalace jako aplikace do telefonu (PWA) ---
let odlozenaInstalace = null;
const instalBtn = document.getElementById('instal');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  odlozenaInstalace = e;
  instalBtn.style.display = '';
});
instalBtn.onclick = async () => {
  if (!odlozenaInstalace) {
    add('jarvis', 'V menu prohlížeče dej „Přidat na plochu". Na iPhonu: Sdílet → Přidat na plochu.');
    return;
  }
  odlozenaInstalace.prompt();
  await odlozenaInstalace.userChoice;
  odlozenaInstalace = null;
  instalBtn.style.display = 'none';
};
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
